workflows:
  recharge-android-debug:
    name: Recharge.af Android debug APK
    instance_type: linux_x2
    max_build_duration: 30
    environment:
      java: 17
    scripts:
      - name: Build Android APK
        script: |
          gradle --no-daemon :app:assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
