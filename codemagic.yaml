workflows:
  recharge-android-debug:
    name: Recharge.af Android debug APK
    instance_type: linux_x2
    max_build_duration: 30
    environment:
      java: 17
    scripts:
      - name: Set Android SDK
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Build installable APK
        script: /home/builder/programs/gradle-8.11.1/bin/gradle --no-daemon :app:assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
